name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check for secrets and personal setup
        run: sh scripts/check-secrets.sh
      - name: Check JavaScript syntax
        run: for f in $(git ls-files 'js/*.js' 'js/**/*.js' sw.js); do node --input-type=module --check < "$f" || exit 1; done
